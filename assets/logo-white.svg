<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 180" width="100%" height="100%">
  <defs>
    <!-- H Letter Royal Blue -->
    <linearGradient id="hGradW" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="60%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- W Letter Cyan Neon -->
    <linearGradient id="wGradW" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#67e8f9" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Pulse Gradient -->
    <linearGradient id="pulseGradW" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#67e8f9" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="hwGlowW" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur1" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- ==================== LEFT: THE HW MONOGRAM & ECG PULSE ==================== -->
  <g transform="translate(30, 15)">
    <!-- Tech Frame Behind HW -->
    <g opacity="0.3" stroke="#38bdf8" stroke-width="1">
      <rect x="15" y="15" width="200" height="120" fill="none" stroke-dasharray="4 4" rx="12" />
      <circle cx="15" cy="15" r="2.5" fill="#38bdf8" />
      <circle cx="215" cy="15" r="2.5" fill="#38bdf8" />
      <circle cx="15" cy="135" r="2.5" fill="#38bdf8" />
      <circle cx="215" cy="135" r="2.5" fill="#38bdf8" />
    </g>

    <!-- 'H' Letter (Royal Blue / Cyan Stroke) -->
    <g>
      <rect x="35" y="24" width="16" height="102" rx="4" fill="url(#hGradW)" stroke="#93c5fd" stroke-width="1.5" />
      <rect x="73" y="24" width="16" height="102" rx="4" fill="url(#hGradW)" stroke="#93c5fd" stroke-width="1.5" />
      <rect x="45" y="67" width="34" height="16" fill="url(#hGradW)" stroke="#93c5fd" stroke-width="1.2" />
      <line x1="43" y1="40" x2="43" y2="110" stroke="#ffffff" stroke-width="1" opacity="0.5" stroke-dasharray="2 3" />
      <line x1="81" y1="40" x2="81" y2="110" stroke="#ffffff" stroke-width="1" opacity="0.5" stroke-dasharray="2 3" />
    </g>

    <!-- 'W' Letter (Bright Cyan Neon) -->
    <g>
      <path d="M 78 28 
               L 95 124 
               L 112 60 
               L 129 124 
               L 146 28" 
            fill="none" 
            stroke="url(#wGradW)" 
            stroke-width="16" 
            stroke-linecap="round" 
            stroke-linejoin="round"
            filter="url(#hwGlowW)" />
      <path d="M 78 28 
               L 95 124 
               L 112 60 
               L 129 124 
               L 146 28" 
            fill="none" 
            stroke="#ffffff" 
            stroke-width="3" 
            stroke-linecap="round" 
            stroke-linejoin="round" />
    </g>

    <!-- Glowing Heartbeat ECG Pulse Line slicing through HW -->
    <g filter="url(#hwGlowW)">
      <path d="M 0 75 
               L 18 75 
               L 26 62 
               L 34 88 
               L 42 45 
               L 52 105 
               L 60 70 
               L 68 75 
               L 104 75 
               L 110 60 
               L 118 90 
               L 126 68 
               L 132 75 
               L 215 75" 
            fill="none" 
            stroke="url(#pulseGradW)" 
            stroke-width="4.5" 
            stroke-linecap="round" 
            stroke-linejoin="round" />
      <path d="M 0 75 
               L 18 75 
               L 26 62 
               L 34 88 
               L 42 45 
               L 52 105 
               L 60 70 
               L 68 75 
               L 104 75 
               L 110 60 
               L 118 90 
               L 126 68 
               L 132 75 
               L 215 75" 
            fill="none" 
            stroke="#ffffff" 
            stroke-width="2" 
            stroke-linecap="round" 
            stroke-linejoin="round" />
    </g>
  </g>

  <!-- Connecting Pulse Lead into the Text -->
  <path d="M 245 90 L 290 90 L 296 80 L 304 100 L 312 85 L 318 90 L 340 90" 
        fill="none" 
        stroke="#38bdf8" 
        stroke-width="2.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        opacity="0.8" 
        filter="url(#hwGlowW)" />

  <!-- ==================== RIGHT: ARABIC "الوجيه" & ENGLISH "AL WAGIH" ==================== -->
  <g transform="translate(340, 20)">
    <g transform="translate(0, 0)">
      <text x="375" y="82" 
            text-anchor="end" 
            font-family="'Segoe UI', Tahoma, Cairo, 'Noto Sans Arabic', sans-serif" 
            font-size="68" 
            font-weight="900" 
            fill="#ffffff" 
            stroke="#38bdf8" 
            stroke-width="1.8" 
            stroke-linejoin="round"
            letter-spacing="1">
        الـوجـيـه
      </text>

      <!-- Custom Double Circle Dots for 'ي' -->
      <g transform="translate(195, 96)">
        <circle cx="0" cy="0" r="4.5" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5" filter="url(#hwGlowW)" />
        <circle cx="13" cy="0" r="4.5" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5" filter="url(#hwGlowW)" />
      </g>
    </g>

    <!-- ENGLISH "AL WAGIH" -->
    <g transform="translate(0, 96)">
      <text x="375" y="32" 
            text-anchor="end" 
            font-family="'Segoe UI', 'Montserrat', -apple-system, sans-serif" 
            font-size="30" 
            font-weight="900" 
            fill="#38bdf8" 
            letter-spacing="5"
            filter="url(#hwGlowW)">
        AL WAGIH
      </text>

      <text x="375" y="47" 
            text-anchor="end" 
            font-family="'Segoe UI', -apple-system, sans-serif" 
            font-size="10" 
            font-weight="700" 
            fill="#cbd5e1" 
            letter-spacing="1.5">
        CLINIC &amp; HOSPITAL ENTERPRISE ERP
      </text>
    </g>
  </g>
</svg>
