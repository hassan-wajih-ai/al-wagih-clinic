<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="opt1Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070d18" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#081e36" />
    </linearGradient>

    <!-- 'H' Letter Royal Blue Gradient -->
    <linearGradient id="opt1HGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>

    <!-- 'W' Letter Cyan Neon Gradient -->
    <linearGradient id="opt1WGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="40%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0891b2" />
    </linearGradient>

    <!-- Glowing Heartbeat Pulse Line Gradient -->
    <linearGradient id="opt1PulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#a5f3fc" />
    </linearGradient>

    <!-- Glow Filter for Neon Pulse -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur1" />
      <feGaussianBlur stdDeviation="8" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0284c7" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Container Box -->
  <rect x="10" y="10" width="180" height="180" rx="44" fill="url(#opt1Bg)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="2" filter="url(#cardShadow)" />

  <!-- Digital Tech Grid Background Pattern -->
  <g opacity="0.18" stroke="#38bdf8" stroke-width="1">
    <line x1="30" y1="50" x2="170" y2="50" stroke-dasharray="3 5" />
    <line x1="30" y1="150" x2="170" y2="150" stroke-dasharray="3 5" />
    <line x1="50" y1="30" x2="50" y2="170" stroke-dasharray="3 5" />
    <line x1="150" y1="30" x2="150" y2="170" stroke-dasharray="3 5" />
    <!-- Tech nodes -->
    <circle cx="50" cy="50" r="2.5" fill="#38bdf8" />
    <circle cx="150" cy="50" r="2.5" fill="#38bdf8" />
    <circle cx="50" cy="150" r="2.5" fill="#38bdf8" />
    <circle cx="150" cy="150" r="2.5" fill="#38bdf8" />
  </g>

  <!-- ==================== LETTER 'H' (Royal Blue) ==================== -->
  <g>
    <!-- Left Vertical Stem -->
    <rect x="42" y="48" width="18" height="104" rx="5" fill="url(#opt1HGrad)" stroke="#60a5fa" stroke-width="1.5" />
    <!-- Right Vertical Stem -->
    <rect x="80" y="48" width="18" height="104" rx="5" fill="url(#opt1HGrad)" stroke="#60a5fa" stroke-width="1.5" />
    <!-- Horizontal Crossbar -->
    <rect x="52" y="91" width="36" height="18" fill="url(#opt1HGrad)" stroke="#60a5fa" stroke-width="1.2" />
    <!-- Inner Digital Circuit Details on H -->
    <line x1="51" y1="65" x2="51" y2="135" stroke="#93c5fd" stroke-width="1" opacity="0.4" stroke-dasharray="2 3" />
    <line x1="89" y1="65" x2="89" y2="135" stroke="#93c5fd" stroke-width="1" opacity="0.4" stroke-dasharray="2 3" />
  </g>

  <!-- ==================== LETTER 'W' (Vibrant Cyan Neon) ==================== -->
  <g>
    <path d="M 86 52 
             L 104 148 
             L 122 84 
             L 140 148 
             L 158 52" 
          fill="none" 
          stroke="url(#opt1WGrad)" 
          stroke-width="17" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          filter="url(#neonGlow)" />
    <!-- Sharp highlight core inside W -->
    <path d="M 86 52 
             L 104 148 
             L 122 84 
             L 140 148 
             L 158 52" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="3" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          opacity="0.8" />
  </g>

  <!-- ==================== GLOWING ECG HEARTBEAT PULSE LINE ==================== -->
  <!-- Slices horizontally across HW -->
  <g filter="url(#neonGlow)">
    <path d="M 16 100 
             L 32 100 
             L 38 86 
             L 46 116 
             L 54 68 
             L 64 130 
             L 72 92 
             L 78 100 
             L 112 100 
             L 118 84 
             L 126 118 
             L 134 92 
             L 140 100 
             L 184 100" 
          fill="none" 
          stroke="url(#opt1PulseGrad)" 
          stroke-width="4.5" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
    <!-- Bright white core for intense electrical pulse effect -->
    <path d="M 16 100 
             L 32 100 
             L 38 86 
             L 46 116 
             L 54 68 
             L 64 130 
             L 72 92 
             L 78 100 
             L 112 100 
             L 118 84 
             L 126 118 
             L 134 92 
             L 140 100 
             L 184 100" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="2" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
  </g>

  <!-- Ambient Light Sparks -->
  <circle cx="54" cy="68" r="3" fill="#ffffff" filter="url(#neonGlow)" />
  <circle cx="64" cy="130" r="3" fill="#ffffff" filter="url(#neonGlow)" />
  <circle cx="126" cy="118" r="2.5" fill="#ffffff" filter="url(#neonGlow)" />
</svg>
