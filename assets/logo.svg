<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 160" width="100%" height="100%" dir="rtl">
  <defs>
    <!-- Background Gradient for Icon Shield -->
    <linearGradient id="wagihLogoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>

    <!-- Teal-Cyan to Emerald Gradient -->
    <linearGradient id="wagihTealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Text Gradient for "الوجيه" -->
    <linearGradient id="wagihTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="60%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="iconShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0284c7" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- ==================== EMBLEM (RIGHT SIDE FOR RTL) ==================== -->
  <g transform="translate(520, 10)">
    <!-- Base Shield -->
    <rect x="0" y="0" width="140" height="140" rx="38" fill="url(#wagihLogoBg)" stroke="rgba(255,255,255,0.2)" stroke-width="2" filter="url(#iconShadow)" />

    <!-- Ambient Ring -->
    <circle cx="70" cy="70" r="58" fill="none" stroke="url(#wagihTealGrad)" stroke-width="1.2" stroke-opacity="0.3" stroke-dasharray="4 3" />

    <!-- Stylized Arabic Waw (و) Loop -->
    <path d="M 70 34 
             C 88 34, 102 48, 102 66
             C 102 82, 88 94, 72 96
             C 56 98, 46 86, 46 72
             C 46 52, 56 34, 70 34 Z" 
          fill="none" 
          stroke="url(#wagihTealGrad)" 
          stroke-width="11" 
          stroke-linecap="round" 
          filter="url(#softGlow)" />

    <!-- Sweeping Tail of Waw -->
    <path d="M 72 96
             C 68 104, 62 112, 52 118
             C 40 124, 28 122, 22 114
             C 19 110, 21 104, 27 102
             C 33 100, 39 104, 46 104
             C 56 102, 64 96, 70 86"
          fill="none" 
          stroke="url(#wagihTealGrad)" 
          stroke-width="9" 
          stroke-linecap="round" />

    <!-- Medical Cross Core -->
    <g transform="translate(70, 65)">
      <rect x="-4.5" y="-16" width="9" height="32" rx="4.5" fill="#ffffff" />
      <rect x="-16" y="-4.5" width="32" height="9" rx="4.5" fill="#ffffff" />
      <circle cx="0" cy="0" r="3.5" fill="#0284c7" />
    </g>

    <!-- Pulse Line (ECG) -->
    <path d="M 22 70 
             L 42 70 
             L 50 58 
             L 58 86 
             L 68 50 
             L 76 78 
             L 84 66 
             L 90 70 
             L 118 70" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="3" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Sparkle Star of Quality -->
    <path d="M 106 28 Q 106 36 114 36 Q 106 36 106 44 Q 106 36 98 36 Q 106 36 106 28 Z" fill="#38bdf8" />
  </g>

  <!-- ==================== TYPOGRAPHY (LEFT SIDE) ==================== -->
  <g transform="translate(0, 0)">
    <!-- Primary Title (Arabic) -->
    <text x="495" y="70" text-anchor="end" font-family="'Segoe UI', Tahoma, Cairo, 'Noto Sans Arabic', sans-serif" font-size="44" font-weight="900" fill="url(#wagihTextGrad)" letter-spacing="-0.5">
      نِظَامُ الوَجِيه
    </text>

    <!-- Decorative Accent Capsule Badge -->
    <g transform="translate(130, 38)">
      <rect x="0" y="0" width="82" height="24" rx="12" fill="#0ea5e9" fill-opacity="0.12" stroke="#0ea5e9" stroke-width="1" />
      <text x="41" y="16" text-anchor="middle" font-family="'Segoe UI', Tahoma, sans-serif" font-size="11" font-weight="800" fill="#0284c7" letter-spacing="0.5">
        ERP 2026
      </text>
    </g>

    <!-- Arabic Subtitle -->
    <text x="495" y="105" text-anchor="end" font-family="'Segoe UI', Tahoma, Cairo, sans-serif" font-size="19" font-weight="700" fill="#475569">
      لإدارة العيادات والمراكز الطبية والمستشفيات
    </text>

    <!-- English Secondary Subtitle -->
    <text x="495" y="132" text-anchor="end" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="13" font-weight="700" fill="#0d9488" letter-spacing="1.8">
      AL WAGIH HEALTHCARE ENTERPRISE
    </text>

    <!-- Small Cyan Dot Divider -->
    <circle cx="218" cy="128" r="3" fill="#0284c7" />
  </g>
</svg>
